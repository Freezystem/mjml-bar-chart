name: MJBarChart Tests

on: push

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup Node and NPM
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install and Build
              run: npm ci --ignore-scripts

            - name: Format and Lint
              run: npm run fl:ci

            - name: Tests
              run: npm run test:coverage

            - name: SonarQube
              uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

            - name: Generate Changelog
              if: github.ref_type == 'tag'
              run: |
                  echo "# What's new ?" > CHANGELOG.md
                  git log --pretty='- %h %s by %aN' --no-merges $(git describe --tags --abbrev=0 @^)..@ >> CHANGELOG.md

            - name: Pre Release
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              if: github.ref_type == 'tag'
              with:
                  body_path: CHANGELOG.md
                  draft: true
